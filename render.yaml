# Despliegue en Render (https://render.com), un solo servicio.
#
# El mismo proceso sirve el sitio y la API. No son dos —el sitio en un
# alojamiento estático y la API aparte— porque el panel del taller no
# funcionaría: src/staff.js manda sus peticiones con credentials:
# "same-origin", la cookie de sesión es SameSite=Strict y el servidor no emite
# Access-Control-Allow-Credentials. Desde otro dominio, el panel respondería 401
# para siempre. Por eso ALLOWED_ORIGINS se queda vacío: no hay peticiones entre
# dominios que permitir.
#
# La base es Neon (https://neon.tech), aparte de Render. La de Render caduca a
# los 30 días en el plan gratuito; la de Neon, no.
#
# El esquema NO se aplica desde aquí. Ver server/migrate.js: schema.sql toca
# filas vivas, y un fallo suyo en buildCommand tumbaría el sitio entero por un
# problema de la base. Se corre a mano, una vez, desde la máquina de trabajo.

services:
  - type: web
    name: autocolor
    runtime: node
    plan: free
    # La misma región de nube que el proyecto de Neon: lo que domina el tiempo
    # de respuesta son las idas y vueltas entre la aplicación y la base.
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # Ver el manejador de /healthz en server/server.js: contesta sin tocar la
    # base, a propósito.
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      # Render escucha en el puerto que anuncia por PORT —que ya lee
      # server/server.js— y necesita que el proceso ate 0.0.0.0. El 127.0.0.1
      # por omisión es deliberado (ver el comentario junto a HOST en
      # server/server.js) y se queda como está: esto es una decisión de este
      # despliegue, no del programa. PORT no se pone aquí; lo da Render.
      - key: HOST
        value: "0.0.0.0"

      # TRES proxies de confianza delante, no uno. Medido con
      # /api/staff/whoami contra el sitio ya desplegado, que para esto es la
      # única fuente fiable:
      #
      #     x-forwarded-for: 151.62.162.119, 172.70.34.4, 10.26.204.136
      #                      ^el cliente     ^Cloudflare  ^el router de Render
      #
      # clientIp() cuenta desde la derecha, así que con TRUST_PROXY=3 sale el
      # primero — el cliente de verdad — y sigue saliendo aunque alguien mande
      # su propia cabecera, porque los tres saltos de la derecha los escriben
      # los proxies y no él.
      #
      # Con 1 salía el router interno de Render, que rota entre tres
      # direcciones: los límites por IP se repartían en tres cubos y no
      # frenaban nada. Y no se veía desde fuera — de ahí /api/staff/whoami.
      #
      # Si algún día cambia la topología del alojamiento, este número cambia
      # con ella. Comprobarlo con whoami después de tocarlo.
      - key: TRUST_PROXY
        value: "3"

      # El sitio se sirve por https, así que la cookie del panel viaja Secure.
      - key: AUTOCOLOR_STAFF_COOKIE_SECURE
        value: "1"

      # Explícito para que se lea que está vacío a propósito, y no por olvido.
      - key: ALLOWED_ORIGINS
        value: ""

      # Los dos secretos se escriben a mano en el panel de Render y no viven en
      # el repositorio, que se publica entero.
      #
      # La URL de Neon: la directa (no la de -pooler), con sslmode=verify-full
      # y sin channel_binding. La que Neon da para copiar trae
      # 'sslmode=require', que en esta versión de pg significa verify-full
      # igual, pero imprime un aviso de obsolescencia y cambiará a algo más
      # débil en pg 9; 'channel_binding' pg lo ignora.
      - key: DATABASE_URL
        sync: false

      # Sin ella, /api/staff/* responde 503 y el panel queda apagado. Se lee una
      # sola vez al arrancar (server/auth.js), así que cambiarla exige reiniciar
      # el servicio.
      - key: AUTOCOLOR_STAFF_PASSWORD
        sync: false

      # The panel's workers, comma-separated, each one a code, a colon and the
      # name it belongs to (AB12345:Ana Bravo,CD67890:Carlos Díaz,…). Needed
      # alongside the password: without them /api/staff/login answers 503 with
      # «El panel del taller no está configurado en este servidor», same as
      # without a password. They are not in the repository because between the
      # codes and the names they say who works at the shop, and like the
      # password they are read once at startup: changing them means restarting
      # the service.
      - key: AUTOCOLOR_WORKER_IDS
        sync: false

      # The workshop boss, one entry written like the ones above. It is accepted
      # without being in the list, and his profile carries the worker monitor —
      # who is holding which vehicle — instead of the start-session button; in
      # exchange he takes no vehicles. Optional: without it there is no boss and
      # the panel works the same. Read once at startup, like the other two.
      - key: AUTOCOLOR_BOSS_ID
        sync: false

      # La llave de la API de Brevo, que es por donde salen los dos avisos de
      # cada solicitud (server/mail.js). Sin ella el asistente sigue guardando
      # solicitudes y nadie recibe aviso: el fallo se registra y ya, porque
      # perder una solicitud por un correo sería mucho peor.
      #
      # POR QUÉ NO EL SMTP DE GMAIL, QUE ES LO QUE HABÍA. Desde aquí no sale.
      # El 465 lo bloquea Render, y por el 587 —que sí deja salir— las
      # conexiones a smtp.gmail.com se agotan sin respuesta a ratos largos.
      # Medido: una conexión sana tarda 22 ms; estas se agotaban a los 15 000
      # sin contestar. Se subieron los topes a un minuto y se le puso delante
      # una cola con seis reintentos en cuarenta y ocho minutos, y aun así los
      # avisos no llegaban. El 443 no lo bloquea nadie.
      #
      # El remitente tiene que estar verificado en Brevo (Senders), o la API
      # contesta 400. Por omisión es el mismo AUTOCOLOR_MAIL_SHOP de abajo.
      - key: AUTOCOLOR_BREVO_KEY
        sync: false

      # A dónde va la copia con los datos del cliente. Un Gmail personal
      # mientras nadie tenga las llaves del correo del dominio; cambiarlo es
      # esta línea y un reinicio, no un cambio de código.
      - key: AUTOCOLOR_MAIL_SHOP
        value: "gabrielesarria167@gmail.com"
