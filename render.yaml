# Deploy on Render (https://render.com), a single service.
#
# The same process serves the site and the API. They are not two (the site
# on a static host and the API elsewhere) because the workshop panel would
# not work: src/staff.js sends its requests with credentials: "same-origin",
# the session cookie is SameSite=Strict and the server does not emit
# Access-Control-Allow-Credentials. From another domain the panel would
# answer 401 forever. That is why ALLOWED_ORIGINS stays empty: there are no
# cross-origin requests to allow.
#
# The database is Neon (https://neon.tech), separate from Render. Render's
# expires after 30 days on the free plan; Neon's does not.
#
# The schema is NOT applied from here. See server/migrate.js: schema.sql
# touches live rows, and a failure of it in buildCommand would take the whole
# site down over a database problem. It is run by hand, once, from the work
# machine.

services:
  - type: web
    name: autocolor
    runtime: node
    plan: free
    # The same cloud region as the Neon project: what dominates response time
    # is the round trips between the application and the database.
    region: virginia
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # See the /healthz handler in server/server.js: it answers without
    # touching the database, on purpose.
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      # Render listens on the port it announces through PORT (which
      # server/server.js already reads) and needs the process to bind 0.0.0.0.
      # The default 127.0.0.1 is deliberate (see the comment next to HOST in
      # server/server.js) and stays as it is: this is a decision of this
      # deploy, not of the program. PORT is not set here; Render provides it.
      - key: HOST
        value: "0.0.0.0"

      # THREE trusted proxies in front, not one. Measured with
      # /api/staff/whoami against the deployed site, which is the only
      # reliable source for this:
      #
      #     x-forwarded-for: 151.62.162.119, 172.70.34.4, 10.26.204.136
      #                      ^the client     ^Cloudflare  ^Render's router
      #
      # clientIp() counts from the right, so with TRUST_PROXY=3 out comes the
      # first one, the real client, and it keeps coming out even if someone
      # sends their own header, because the three hops on the right are
      # written by the proxies and not by them.
      #
      # With 1 out came Render's internal router, which rotates between three
      # addresses: the per-IP limits were split across three buckets and
      # stopped nothing. And it was not visible from outside, hence
      # /api/staff/whoami.
      #
      # If the host's topology ever changes, this number changes with it.
      # Check it with whoami after touching it.
      - key: TRUST_PROXY
        value: "3"

      # The site is served over https, so the panel cookie travels Secure.
      - key: AUTOCOLOR_STAFF_COOKIE_SECURE
        value: "1"

      # Explicit so it reads as empty on purpose, not by oversight.
      - key: ALLOWED_ORIGINS
        value: ""

      # Both secrets are typed by hand in Render's dashboard and do not live
      # in the repository, which is published whole.
      #
      # The Neon URL: the direct one (not the -pooler one), with
      # sslmode=verify-full and no channel_binding. The one Neon gives you to
      # copy carries 'sslmode=require', which in this pg version means
      # verify-full all the same, but prints a deprecation warning and will
      # change to something weaker in pg 9; pg ignores 'channel_binding'.
      - key: DATABASE_URL
        sync: false

      # The colour database: the Sherwin-Williams catalogue that identifies
      # colours on the matizado page. It is another database and another
      # role, not the one above under another name.
      #
      # The role is colordb_app, which cannot read any table: it can only run
      # six functions. It is created with SQL and never from the Neon console,
      # where it would get neon_superuser and could read everything. See
      # server/colordb/README.md.
      #
      # Here sslmode=verify-full is not a recommendation: server/colordb.js
      # checks the URL at startup and does not connect if it is missing. If
      # this variable is not set, the site works the same (the finder answers
      # 503 and the page uses the local catalogue), so it is no reason not to
      # deploy.
      #
      # The owner role (AUTOCOLOR_COLORDB_ADMIN_URL) does NOT go here: it loads
      # the tables from the work machine and the server has nothing to do with it.
      - key: AUTOCOLOR_COLORDB_URL
        sync: false

      # Without it, /api/staff/* answers 503 and the panel stays off. It is
      # read once at startup (server/auth.js), so changing it requires
      # restarting the service.
      - key: AUTOCOLOR_STAFF_PASSWORD
        sync: false

      # The panel's workers, comma-separated, each one a code, a colon and the
      # name it belongs to (AB12345:Ana Bravo,CD67890:Carlos Díaz,…). Needed
      # alongside the password: without them /api/staff/login answers 503 with
      # «El panel del taller no está configurado en este servidor», same as
      # without a password. They are not in the repository because between the
      # codes and the names they say who works at the shop, and like the
      # password they are read once at startup: changing them means restarting
      # the service.
      - key: AUTOCOLOR_WORKER_IDS
        sync: false

      # The workshop boss, one entry written like the ones above. It is accepted
      # without being in the list, and his profile carries the worker monitor
      # (who is holding which vehicle) instead of the start-session button; in
      # exchange he takes no vehicles. Optional: without it there is no boss and
      # the panel works the same. Read once at startup, like the other two.
      - key: AUTOCOLOR_BOSS_ID
        sync: false

      # The Brevo API key, which is how the two notices for each request go
      # out (server/mail.js). Without it the wizard keeps storing requests and
      # nobody gets a notice: the failure is logged and that is it, because
      # losing a request over an email would be far worse.
      #
      # WHY NOT GMAIL'S SMTP, WHICH IS WHAT THERE WAS. It does not get out from
      # here. Render blocks 465, and on 587 (which does let traffic out)
      # connections to smtp.gmail.com time out with no answer for long
      # stretches. Measured: a healthy connection takes 22 ms; these timed out
      # at 15,000 without answering. The caps went up to a minute and a queue
      # with six retries over forty-eight minutes went in front, and still the
      # notices did not arrive. Nobody blocks 443.
      #
      # The sender has to be verified in Brevo (Senders), or the API answers
      # 400. By default it is the same AUTOCOLOR_MAIL_SHOP below.
      - key: AUTOCOLOR_BREVO_KEY
        sync: false

      # Where the copy with the customer's details goes. A personal Gmail
      # while nobody has the keys to the domain's mail; changing it is this
      # line and a restart, not a code change.
      - key: AUTOCOLOR_MAIL_SHOP
        value: "gabrielesarria167@gmail.com"

      # The public address used in email links and logo URLs, and accepted as
      # this site's Origin on POST /api/requests. Without it both fall back to
      # RENDER_EXTERNAL_URL (the onrender.com host). Set it in Render once the
      # custom domain serves the site.
      - key: AUTOCOLOR_SITE_URL
        sync: false
