<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17150f">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <script src="../src/config.js" defer></script>
    <script src="../src/staff.js" defer></script>
    <title>Autocolor · Taller</title>
</head>

<!-- Página interna: sin la cabecera ni el menú del sitio público. Se entra por
     la dirección directa, y lo que la protege es la contraseña que pide la API
     (server/auth.js), no el hecho de que no esté enlazada.

     Además queda fuera de la publicación: _config.yml la excluye de GitHub
     Pages, así que en el sitio público no existe. -->

<body class="staff">

    <header class="staff-topbar">
        <img class="staff-topbar__logo" src="../imgs/logoDark.png" alt="Autocolor">
        <span class="staff-topbar__rule" aria-hidden="true"></span>
        <span class="staff-topbar__label">Taller</span>
        <button type="button" class="staff-topbar__logout" id="staffLogout" hidden>Salir</button>
    </header>

    <main class="staff-page" id="staffApp">

        <p class="staff-loading" id="staffLoading">Cargando…</p>

        <section class="lookup staff-login" id="staffLogin" aria-labelledby="staffLoginTitle" hidden>
            <div class="lookup__head">
                <h2 id="staffLoginTitle">Acceso del taller</h2>
                <p>Ingresa la contraseña del taller para ver las solicitudes.</p>
            </div>

            <form class="lookup__form" id="staffLoginForm" novalidate>
                <div class="field">
                    <label for="staffPassword">Contraseña</label>
                    <input type="password" id="staffPassword" name="staffPassword" autocomplete="current-password"
                        aria-describedby="staffError" required>
                </div>
                <button type="submit" class="lookup__submit" id="staffLoginSubmit">Entrar</button>
            </form>
        </section>

        <section class="staff-panel" id="staffPanel" aria-labelledby="staffPanelTitle" hidden>

            <header>
                <h1 id="staffPanelTitle">Autocolor Taller</h1>
                <p class="staff-page__count" id="staffCount"></p>
            </header>

            <div class="staff-tools">
                <div class="staff-search">
                    <label class="sr-only" for="staffSearch">Buscar solicitudes</label>
                    <input type="search" class="staff-search__input" id="staffSearch"
                        placeholder="Buscar por placa, cliente o código…" autocomplete="off">
                </div>

                <!-- Los filtros se generan en src/staff.js a partir de la misma
                     lista de estados que pinta las píldoras, para que no haya
                     dos sitios donde agregar un estado nuevo. -->
                <div class="staff-filters" id="staffFilters" role="group" aria-label="Filtrar por estado"></div>
            </div>

            <div class="staff-card">
                <div class="staff-table__scroll">
                    <table class="staff-table">
                        <thead>
                            <tr>
                                <th scope="col">Código</th>
                                <th scope="col">Placa</th>
                                <th scope="col">Cliente</th>
                                <th scope="col">Teléfono</th>
                                <th scope="col">Vehículo</th>
                                <th scope="col">Ingreso</th>
                                <th scope="col">Piezas</th>
                                <th scope="col">Acabado</th>
                                <th scope="col">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="staffRows"></tbody>
                    </table>
                </div>

                <p class="staff-empty" id="staffEmpty" hidden>No se encontraron solicitudes con esos criterios.</p>
            </div>

            <p class="staff-note">Los cambios de estado se guardan solos.</p>
        </section>

        <p class="form-error" id="staffError" role="alert" hidden></p>
    </main>

</body>

</html>
